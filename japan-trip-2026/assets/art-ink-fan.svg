<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-hidden="true">
  <title>Ink fan lattice</title>
  <defs>
    <radialGradient id="hub" cx="50%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#0e1012" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="280" rx="160" ry="40" fill="url(#hub)"/>
  <g fill="none" stroke="#e8c56a" stroke-linecap="round">
    <path d="M200 280 L60 60" stroke-opacity=".22" stroke-width="1.4"/>
    <path d="M200 280 L100 48" stroke-opacity=".18" stroke-width="1.2"/>
    <path d="M200 280 L140 40" stroke-opacity=".2" stroke-width="1.2"/>
    <path d="M200 280 L180 36" stroke-opacity=".24" stroke-width="1.3"/>
    <path d="M200 280 L220 36" stroke-opacity=".24" stroke-width="1.3"/>
    <path d="M200 280 L260 40" stroke-opacity=".2" stroke-width="1.2"/>
    <path d="M200 280 L300 48" stroke-opacity=".18" stroke-width="1.2"/>
    <path d="M200 280 L340 60" stroke-opacity=".22" stroke-width="1.4"/>
  </g>
  <!-- arc ribs -->
  <path d="M70 90 Q200 20 330 90" fill="none" stroke="#e8c56a" stroke-opacity=".2" stroke-width="1.2"/>
  <path d="M90 140 Q200 80 310 140" fill="none" stroke="#e8c56a" stroke-opacity=".14" stroke-width="1"/>
  <path d="M120 190 Q200 140 280 190" fill="none" stroke="#e8c56a" stroke-opacity=".12" stroke-width="1"/>
  <circle cx="200" cy="280" r="6" fill="#e8c56a" fill-opacity=".35"/>
