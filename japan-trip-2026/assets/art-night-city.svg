<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-hidden="true">
  <title>Abstract night city wash</title>
  <!-- Original geometric silhouette: amber/ink night desk atmosphere. Not a real skyline. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity=".14"/>
      <stop offset="38%" stop-color="#c9a84a" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#0e1012" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8c56a" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="build" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity=".02"/>
    </linearGradient>
  </defs>
  <rect width="960" height="360" fill="url(#sky)"/>
  <!-- soft horizon glow -->
  <ellipse cx="480" cy="268" rx="420" ry="36" fill="url(#glow)"/>
  <!-- geometric blocks (abstract towers) -->
  <g fill="url(#build)" stroke="#e8c56a" stroke-opacity=".12" stroke-width="1">
    <rect x="72" y="168" width="48" height="120"/>
    <rect x="128" y="132" width="36" height="156"/>
    <rect x="172" y="188" width="64" height="100"/>
    <rect x="248" y="148" width="28" height="140"/>
    <rect x="284" y="112" width="52" height="176"/>
    <rect x="344" y="172" width="40" height="116"/>
    <rect x="396" y="96" width="34" height="192"/>
    <rect x="440" y="156" width="58" height="132"/>
    <rect x="510" y="124" width="30" height="164"/>
    <rect x="552" y="180" width="72" height="108"/>
    <rect x="636" y="140" width="38" height="148"/>
    <rect x="684" y="108" width="46" height="180"/>
    <rect x="742" y="164" width="54" height="124"/>
    <rect x="808" y="128" width="32" height="160"/>
    <rect x="852" y="176" width="60" height="112"/>
  </g>
  <!-- window ticks -->
  <g stroke="#e8c56a" stroke-opacity=".28" stroke-width="1.2" stroke-linecap="round">
    <path d="M90 190 h12 M90 210 h12 M90 230 h12 M140 160 h10 M140 180 h10 M140 200 h10
             M300 140 h14 M300 160 h14 M300 200 h14 M410 120 h10 M410 150 h10 M410 180 h10
             M560 150 h8 M560 170 h8 M560 210 h8 M700 130 h12 M700 160 h12 M700 200 h12
             M820 150 h10 M820 180 h10 M820 220 h10"/>
  </g>
  <!-- ground plane line -->
  <path d="M40 288 H920" fill="none" stroke="#e8c56a" stroke-opacity=".16" stroke-width="1"/>
  <path d="M40 292 H920" fill="none" stroke="#e8c56a" stroke-opacity=".06" stroke-width="3"/>
</svg>
