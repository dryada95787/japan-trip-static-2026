<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-hidden="true">
  <title>Transit corridor</title>
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity=".02"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- perspective box -->
  <path d="M80 80 L280 160 L280 320 L80 400 Z" fill="url(#wall)" stroke="#e8c56a" stroke-opacity=".12" stroke-width="1"/>
  <path d="M560 80 L360 160 L360 320 L560 400 Z" fill="url(#wall)" stroke="#e8c56a" stroke-opacity=".12" stroke-width="1" transform="scale(-1,1) translate(-640,0)"/>
  <path d="M280 320 L360 320 L560 400 L80 400 Z" fill="url(#floor)" stroke="#e8c56a" stroke-opacity=".1" stroke-width="1"/>
  <path d="M280 160 L360 160 L560 80 L80 80 Z" fill="#e8c56a" fill-opacity=".03" stroke="#e8c56a" stroke-opacity=".08" stroke-width="1"/>
  <!-- vanishing point glow -->
  <ellipse cx="320" cy="240" rx="40" ry="50" fill="#e8c56a" fill-opacity=".08"/>
  <rect x="300" y="200" width="40" height="80" rx="2" fill="none" stroke="#e8c56a" stroke-opacity=".28" stroke-width="1.2"/>
  <!-- floor lines -->
  <g stroke="#e8c56a" stroke-opacity=".15" stroke-width="1" fill="none">
    <path d="M320 320 L200 400"/>
    <path d="M320 320 L320 400"/>
    <path d="M320 320 L440 400"/>
  </g>
  <!-- ceiling lights -->
  <g fill="#e8c56a" fill-opacity=".25">
    <rect x="290" y="175" width="8" height="3" rx="1"/>
    <rect x="342" y="175" width="8" height="3" rx="1"/>
    <rect x="250" y="140" width="6" height="2" rx="1"/>
    <rect x="384" y="140" width="6" height="2" rx="1"/>
  </g>
</svg>
