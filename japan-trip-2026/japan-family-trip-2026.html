function hilite(text){

    '07:15–07:30','12:30–13:00','8:30–8:45','五辛なし','五辛抜き','完全預約','週一可能休',
    '自備素食','先退稅','往機場','往 KIX','μ-SKY','ミュースカイ','Rapi:t','ラピート',

    'KIX','託運','推薦'

  const escRe = s0 => s0.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

  if(id==='1201' || id==='1201o') return {key:'shinkansen', depth:'assets/art-shinkansen.svg', hero:'assets/art-shinkansen.svg', stamp:'assets/art-corridor.svg', chapter:'assets/art-shinkansen.svg'};

function cidArtPrimary(m){
  if(m.key==='osaka' || m.key==='corridor') return 'assets/art-night-city.svg';
  if(m.key==='shinkansen') return 'assets/art-shinkansen.svg';
  if(m.key==='hills') return 'assets/art-soft-hills.svg';
  return 'assets/art-ink-bloom.svg';
}

function findEventForRef(ref){
  if(!ref) return null;
  const day = getDay();
  if(!day) return null;
  return (day.events||[]).find(e => (e.refs||[]).includes(ref)) || null;
}
function isTransportCard(id, card){
  const TRANSPORT_IDS = new Set(['muSky','toHotel','airportNagoya','airportOsaka','ghibliAccess','toOsaka','toKix','transport','luggageTip']);
  if(TRANSPORT_IDS.has(id)) return true;
  const blob = id + ' ' + (card.title||'') + ' ' + (card.tagline||'');
  return /交通|μ|SKY|Linimo|のぞみ|KIX|機場|進城|往 |Rapi:t|名鉄|新幹線/.test(blob);
}
function isRestaurantCard(id, card){
  const RESTAURANT_IDS = new Set(['grains','kenbi','oribio','shama','saijiki','paprika','minamo','bookingTip','food','konbini']);
  if(RESTAURANT_IDS.has(id)) return true;
  return /訂位|餐廳|素食|講稿/.test((card.title||'')+(card.tagline||''));
}
function isMoneyCard(id, card){
  return id==='taxFree' || id==='payIc' || id==='nightSafety' || /免稅|支付|錢|安全/.test((card.title||'')+(card.tagline||''));
}
function isBackupCard(id, card){
  return id==='rainFatigue' || /^backup/.test(id) || /備案|雨天/.test((card.title||'')+(card.tagline||''));
}
function guideTabForCard(id){
  if(['muSky','toHotel','airportNagoya'].includes(id)) return 'ngo';
  if(id==='ghibliAccess') return 'ghibli';
  if(id==='toOsaka') return 'shinkansen';
  if(['toKix','airportOsaka'].includes(id)) return 'kix';
  return 'ngo';
}
function renderCompare(cmp){
  if(!cmp || !cmp.rows || !cmp.rows.length) return '';
  const left = cmp.left || '推薦';
  const right = cmp.right || '較省';
  const head = `<thead><tr><th>項目</th><th>${esc(left)}</th><th>${esc(right)}</th></tr></thead>`;
  const body = cmp.rows.map(r => {
    const [item, rec, alt] = r;
    return `<tr><td>${esc(item||'')}</td><td class="rec">${esc(rec||'')}</td><td class="alt">${esc(alt||'')}</td></tr>`;
  }).join('');
  return `<table class="cmp-table">${head}<tbody>${body}</tbody></table>`;
}
function renderDetail(){
  const box = el('detailPanel');
  if(!box) return;
  const day = getDay();
  const ev = (day && state.selectedEventIdx!=null) ? day.events[state.selectedEventIdx] : null;
  const ref = state.selectedRef;
  const card = ref ? DATA.cards[ref] : null;
  const placeTitle = el('placeSheetTitle');

  const bindRefPills = (root)=>{
    root.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{
      state.selectedRef=b.dataset.ref;
      if(state.selectedEventIdx==null) state.selectedEventIdx = findEventIdxByRef(state.selectedRef);
      renderDetail(); renderTimeline(); renderSide();
      syncPlaceSheetVisibility();
    });
    root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCat(b.dataset.open));
  };

  if(ev && !card){
    if(placeTitle) placeTitle.textContent = ev.name || '事件';
    const pills = (ev.refs||[]).map(r=>{
      const missing=!DATA.cards[r];
      const title = missing ? ('缺卡・'+r) : ((DATA.cards[r]&&DATA.cards[r].title)||r);

    }).join('');

      <div class="tagline">${esc(ev.time||'')}${ev.desc?' · ':''}${hilite(ev.desc||'')}</div>
      ${pills?`<div class="sec"><div class="sec-label">關聯</div><div class="ev-refs">${pills}</div></div>`:'<p class="empty-ctx">此事件尚無關聯卡。</p>'}
      <div class="ctx-actions">
        <button type="button" class="btn-primary" data-open="plan">打開備案</button>
      </div>
    </div>`;
    bindRefPills(box);
    return;
  }

  if(!card){
    if(placeTitle) placeTitle.textContent = ref ? ('缺卡・'+ref) : '場地詳情';
    if(ref){
      box.innerHTML = `<div class="empty-ctx"><div class="dangerbox">缺卡：${esc(ref)}（未刪行程引用，僅提示）</div>
        <div class="next"><button type="button" data-go="ghibliRoute">打開：吉卜力園內動線</button></div></div>`;
    } else {
      box.innerHTML = `<div class="empty-ctx">一日總覽已顯示全部行程。<br>點時間軸上的事件，這裡會展開場地細節。
        <div class="next"><button type="button" data-go="ghibliRoute">打開：吉卜力園內動線</button></div></div>`;
    }
    box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
      state.selectedRef=b.dataset.go;
      state.selectedEventIdx=findEventIdxByRef(state.selectedRef);
      renderDetail();renderTimeline();renderSide();
      syncPlaceSheetVisibility();
    });
    return;
  }

  const fromEv = ev || findEventForRef(ref);
  if(placeTitle) placeTitle.textContent = fromEv ? fromEv.name : (card.title || '場地詳情');

  const because = fromEv ? `<div class="because">因為：${esc(fromEv.name)}${fromEv.time?' · '+esc(fromEv.time):''}</div>` : '';

  // Map existing fields → labeled sections; omit if empty. Do NOT invent facts.
  const sections = [];
  // 特別：tagline (+ body if no steps, as "what's special")
  if(card.tagline){
    sections.push(`<div class="sec"><div class="sec-label">特別</div><p class="sec-body">${hilite(card.tagline)}</p></div>`);
  }
  if(card.body){
    const label = (card.steps && card.steps.length) ? '補充' : '特別／體驗';
    // If we already used 特別 for tagline, body gets 補充 or 內容
    const lab = card.tagline ? '內容' : '特別／體驗';
    sections.push(`<div class="sec"><div class="sec-label">${lab}</div><p class="sec-body">${hilite(card.body)}</p></div>`);
  }
  if(Array.isArray(card.steps) && card.steps.length){
    const flow = card.steps.length >= 3
      ? `<ol class="flow-steps">${card.steps.map((s,i)=>`<li><span class="flow-num">${i+1}</span><span>${esc(s)}</span></li>`).join('')}</ol>`
      : `<ul class="bullet-list">${card.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
    sections.push(`<div class="sec"><div class="sec-label">怎麼走／怎麼體驗</div>${flow}</div>`);
  }
  if(card.compare && card.compare.rows && card.compare.rows.length){
    sections.push(`<div class="sec"><div class="sec-label">比較</div>${renderCompare(card.compare)}</div>`);
  }
  if(card.kv && card.kv.length){
    const kvHtml = `<ul class="bullet-list kv-bullets">${card.kv.map(([k,v])=>`<li><b>${esc(k)}</b>：${hilite(v)}</li>`).join('')}</ul>`;
    sections.push(`<div class="sec"><div class="sec-label">注意</div>${kvHtml}</div>`);
  }
  if(card.phrase){
    sections.push(`<div class="sec"><div class="sec-label">可複製日文</div>${phraseBlock(card.phrase,'可直接出示給店員／司機／駅員')}</div>`);
  }

  // Related refs as compact pills if event has multiple
  let moreRefs = '';
  if(fromEv && (fromEv.refs||[]).length > 1){
    moreRefs = `<div class="sec"><div class="sec-label">更多關聯</div><div class="ev-refs">${(fromEv.refs||[]).map(r=>{
      const missing=!DATA.cards[r];
      const title = missing ? ('缺卡・'+r) : ((DATA.cards[r]&&DATA.cards[r].title)||r);
      const on = r===ref ? ' active-ref' : '';
      return `<button type="button" class="link-pill${on} ${missing?'missing':''}" data-ref="${esc(r)}">${esc(title)}</button>`;
    }).join('')}</div></div>`;
  }

  const transport = isTransportCard(ref, card);
  const restaurant = isRestaurantCard(ref, card);
  const money = isMoneyCard(ref, card);
  const backup = isBackupCard(ref, card);

  let primaryLabel = '打開「行」';
  let primaryAction = 'move';
  if(transport){ primaryLabel = '打開交通圖文'; primaryAction = 'guide'; }
  else if(restaurant){ primaryLabel = '打開訂位包'; primaryAction = 'book'; }
  else if(money){ primaryLabel = '打開錢／安全'; primaryAction = 'money'; }
  else if(backup){ primaryLabel = '雨天備案'; primaryAction = 'plan'; }

  const titleHtml = fromEv
    ? `<h3 class="place-h">${hilite(fromEv.name)}</h3><div class="tagline">${esc(card.title)}${card.tagline?' · '+esc(card.tagline):''}</div>`
    : `<h3 class="place-h">${esc(card.title)}</h3>${card.tagline?`<div class="tagline">${esc(card.tagline)}</div>`:''}`;

  box.innerHTML = `<div class="detail-card">
    ${because}
    ${titleHtml}
    ${sections.join('')}
    ${moreRefs}
    <div class="ctx-actions">
      <button type="button" class="btn-primary" id="btnCtxPrimary">${esc(primaryLabel)}</button>
    </div></div>`;
  bindCopy(box);
  bindRefPills(box);
  const runPrimary = ()=>{
    if(primaryAction==='guide'){ state._gTab = guideTabForCard(ref); openCat('move','guide'); }
    else if(primaryAction==='book'){ state._bookSub = 'all'; openCat('eat','book'); }
    else if(primaryAction==='money'){ openCat('money'); }
    else if(primaryAction==='plan'){ openCat('plan'); }
    else { openCat('move'); }
  };
  const bp = el('btnCtxPrimary');
  if(bp) bp.onclick = runPrimary;
}

function routeSvg(stops, opts){
  opts = opts || {};
  const color = opts.color || '#d4a017', color2 = opts.color2 || '#f0c14a';
  const n = stops.length, W = 640, H = 118, pad = 48, usable = W - pad*2, cy = 48;
  let circles='', labels='', lineSegs='';
  for(let i=0;i<n;i++){
    const x = pad + (n===1 ? usable/2 : (usable * i/(n-1)));
    const s = stops[i], fill = s.hl ? color2 : color;
    circles += `<circle cx="${x}" cy="${cy}" r="${s.hl?9:7}" fill="${fill}" stroke="#1a1c1e" stroke-width="2"/>`;
    if(i<n-1){ const x2 = pad + usable * (i+1)/(n-1);
      lineSegs += `<line x1="${x+8}" y1="${cy}" x2="${x2-8}" y2="${cy}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`; }
    const sub = s.sub ? `<tspan x="${x}" dy="14" fill="#9aa0a6" font-size="10">${esc(s.sub)}</tspan>` : '';
    labels += `<text x="${x}" y="${cy+28}" text-anchor="middle" font-size="12" fill="#e8eaed" font-family="PingFang TC,Noto Sans TC,Microsoft JhengHei,sans-serif">${esc(s.label)}${sub}</text>`;
  }

      tabs.innerHTML = tabBtns(defs,cur,'data-tab');
      tabs.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>openCat('money', btn.dataset.tab));
      body.innerHTML = `<div class="warnbox"><b>2026/11 起：</b>店內常先付<b>含稅價</b>，機場海關確認後再退稅。保留收據與護照。</div>
        <div class="hl-keep" style="display:block;margin:8px 0;padding:8px 12px">必留：<mark class="hl">KIX 先退稅再 Check-in</mark>（托運前）</div>
        <ul class="clean">
          <li>大採買：大阪 <b>12/1–12/3</b></li>
          <li>電器：確認 110V、保固、頻段</li>
          <li>回程 <mark class="hl"><b>KIX 12/4</b></mark>：<mark class="hl">先退稅</mark>確認再 <mark class="hl">Check-in</mark></li>
        </ul>`;
    } else if(cur==='emergency'){
      const eTabs = [{id:'num',label:'電話'},{id:'lost',label:'迷路'},{id:'allergy',label:'五辛／過敏'},{id:'night',label:'夜間回住'}];
      const ecur = (state._eTab && eTabs.some(t=>t.id===state._eTab)) ? state._eTab : 'num';
      state._eTab = ecur;
      tabs.innerHTML = tabBtns(defs,cur,'data-tab') + '<span style="width:8px"></span>' + tabBtns(eTabs,ecur,'data-etab');
      tabs.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{state._eTab=null;openCat('money', btn.dataset.tab);});
      tabs.querySelectorAll('[data-etab]').forEach(btn=>btn.onclick=()=>{state._eTab=btn.dataset.etab;openCat('money','emergency');});
      if(ecur==='num'){
        body.innerHTML = `<div class="dangerbox">緊急：警察 <b>110</b>／急救消防 <b>119</b>。</div>
          <div class="kv">
            <b>警察</b><div>110</div><b>急救／消防</b><div>119</div>
            <b>駐大阪辦事處</b><div>06-6227-8623（出發前再確認）</div>
            <b>國人急難</b><div>090-8794-4568（出發前再確認）</div>
            <b>名古屋</b><div>領務多由駐大阪涵蓋</div>
          </div>
          <p class="small">出國前再開一次 roc-taiwan.org 確認。</p>
          ${phraseBlock('警察を呼んでください。／救急車を呼んでください。','請幫我叫警察／救護車')}`;
      } else if(ecur==='lost'){
        body.innerHTML = `<p><b>名古屋</b></p>
          ${phraseBlock('道に迷いました。この住所まで行きたいです。\\n名古屋市西区則武新町2-10-4','迷路了，想去則武')}
          <p><b>大阪</b></p>
          ${phraseBlock('道に迷いました。この住所まで行きたいです。\\n大阪市西成区花園南1-11','迷路了，想去花園南')}
          ${phraseBlock('一番近い駅まで連れて行ってください。日本語が話せません。','請帶我去最近車站')}`;
      } else if(ecur==='allergy'){
        body.innerHTML = `${phraseBlock('アレルギーがあります。この食材は絶対だめです：肉・魚・卵・（乳）・ねぎ・玉ねぎ・にんにく・にら・らっきょう。','以下絕對不行')}
          <p class="zh-note">五辛對爸媽舅舅是硬限制。</p>`;
      } else {
        body.innerHTML = `<div class="warnbox">西成／花園南：夜晚結伴、走大路，早回住。</div>
          <ul class="clean"><li>迷路先進便利商店或車站</li><li>計程車出示地址日文</li></ul>
          ${phraseBlock('この住所までお願いします。大きな道を通ってください。\\n大阪市西成区花園南1-11','請走大路送我回這個地址')}`;
      }
    } else {
      tabs.innerHTML = tabBtns(defs,cur,'data-tab');
      tabs.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>openCat('money', btn.dataset.tab));
      body.innerHTML = costHtml();
    }
  } else if(cat==='plan'){
    title.textContent = '備案｜雨天／體力';
    tabs.hidden = true;
    body.innerHTML = `<div class="infobox">原則：<span class="hl-keep">保留已訂晚餐</span>＋吉卜力 <mark class="hl">大倉庫</mark>；砍第二景點與遠距離走路。</div>
      <ul class="clean">
        <li><b>11/27</b>：延誤就只入住＋AEON／超商</li>
        <li><b>11/28</b>：改名駅地下街；晚餐 Grains 保留</li>
        <li><b>11/29</b>：必留 13:00 大倉庫；砍どんどこ→もののけ→青春之丘</li>
        <li><b>11/30</b>：熱田短訪或名駅室內；只留 ORIBIO（若有開）</li>
        <li><b>12/1</b>：兩端計程車；下午取消輕逛；Shama 保留（咲璽季火休）</li>
        <li><b>12/2–12/3</b>：心斎橋百貨；取消新世界</li>
        <li><b>12/4</b>：可砍みなも；必準時到 KIX</li>
      </ul>
      <p class="small">各日細節也可點時間軸「備案」標籤。</p>`;
  } else {
    title.textContent = '工具'; body.innerHTML = '<p>未知分類</p>';
  }
  bindCopy(body);
  el('modalBg').classList.add('show');
}
function closeSheet(){
  el('modalBg').classList.remove('show');
  state.toolCat = null; state.toolTab = null;
  setCatPressed(null);
}

function prefersReducedMotion(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}
let lastChapterKey = state.city + ':' + state.dayId;
function chapterKey(){ return state.city + ':' + state.dayId; }
function runDayChapter(thenFn){
  lastChapterKey = chapterKey();
  if(thenFn) thenFn();
}

function changeDay(dayId, opts){
  opts = opts || {};
  const next = dayId;
  if(!next) return;
  const same = (state.dayId === next && !opts.forceCity);
  if(opts.city) state.city = opts.city;
  state.dayId = next;
  state.selectedRef = opts.selectedRef != null ? opts.selectedRef : null;
  state.selectedEventIdx = opts.selectedEventIdx != null ? opts.selectedEventIdx : null;
  if(!opts.keepSheet) closePlaceSheet();
  if(same && !opts.force){
    renderAll();
    return;
  }
  runDayChapter(()=>{
    renderAll();
    requestAnimationFrame(()=>el('timelinePanel').scrollIntoView({behavior:prefersReducedMotion()?'auto':'smooth',block:'start'}));
  });
}

function renderAll(){ renderCitySwitch(); renderSide(); renderTimeline(); renderDetail(); syncPlaceSheetVisibility(); }
function auditRefs(){
  const missing = new Set();
  Object.values(DATA.cities).forEach(c=>{
    c.days.forEach(d=>d.events.forEach(e=>(e.refs||[]).forEach(r=>{ if(!DATA.cards[r]) missing.add(r); })));
  });
  if(missing.size) console.warn('Missing cards:', [...missing]);
  return [...missing];
}
document.querySelectorAll('[data-cat]').forEach(b=>{ b.onclick=()=>openCat(b.dataset.cat); });
el('modalClose').onclick=closeSheet;
el('placeSheetClose').onclick=()=>{ state.selectedRef=null; state.selectedEventIdx=null; closePlaceSheet(); renderTimeline(); renderSide(); renderDetail(); };
el('placeSheetBg').onclick=(e)=>{ if(e.target.id==='placeSheetBg'){ state.selectedRef=null; state.selectedEventIdx=null; closePlaceSheet(); renderTimeline(); renderSide(); renderDetail(); } };
el('modalBg').onclick=(e)=>{ if(e.target.id==='modalBg') closeSheet(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

function jumpAlert(kind){
  if(kind==='veg'){
    openCat('eat','veg');
    return;
  }
  if(kind==='ghibli'){
    changeDay('1129', {city:'nagoya', selectedRef:'ghibliRoute'});
    window.setTimeout(()=>{
      state.selectedEventIdx = findEventIdxByName(/大倉庫/) ?? findEventIdxByRef('ghibliRoute');
      if(state.selectedEventIdx!=null){
        const ev = getDay().events[state.selectedEventIdx];
        state.selectedRef = (ev.refs&&ev.refs[0]) || 'ghibliRoute';
      }
      renderDetail(); renderTimeline(); renderSide(); syncPlaceSheetVisibility();
    }, 0);
    return;
  }
  if(kind==='tax'){
    changeDay('1204', {city:'osaka'});
    window.setTimeout(()=>{
      state.selectedEventIdx = findEventIdxByName(/起飛|往 KIX|みなも/) ?? findEventIdxByRef('toKix');
      state.selectedRef = 'taxFree';
      const ev = (getDay() && state.selectedEventIdx!=null) ? getDay().events[state.selectedEventIdx] : null;
      if(ev && (ev.refs||[]).includes('toKix')) state.selectedRef = 'toKix';
      else if(ev && (ev.refs||[]).includes('taxFree')) state.selectedRef = 'taxFree';
      renderDetail(); renderTimeline(); renderSide(); syncPlaceSheetVisibility();
    }, 0);
    return;
  }
}
function findEventIdxByName(re){
  const day = getDay();
  if(!day) return null;
  const i = (day.events||[]).findIndex(e => re.test((e.name||'')+' '+(e.desc||'')));
  return i>=0 ? i : null;
}
document.querySelectorAll('.global-alerts [data-jump]').forEach(p=>{
  const go = ()=>jumpAlert(p.dataset.jump);
  p.addEventListener('click', go);
  p.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); go(); }
  });
});

auditRefs();
renderAll();



</script>
