<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" role="img" aria-label="NGO to KIX route mark">
  <title>NGO → KIX</title>
  <!-- Abstract warm-ink route: Nagoya arrival to Kansai departure -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c56a"/>
      <stop offset="55%" stop-color="#c9a84a"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <!-- soft corridor -->
  <path d="M10 28 C 28 10, 48 38, 62 22 S 92 8, 110 24" fill="none" stroke="#e8c56a" stroke-opacity=".14" stroke-width="10" stroke-linecap="round"/>
  <!-- main route -->
  <path d="M10 28 C 28 10, 48 38, 62 22 S 92 8, 110 24" fill="none" stroke="url(#ink)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- NGO node -->
  <circle cx="10" cy="28" r="4.2" fill="#e8c56a"/>
  <circle cx="10" cy="28" r="7" fill="none" stroke="#e8c56a" stroke-opacity=".28" stroke-width="1"/>
  <!-- mid waypoint (transfer) -->
  <circle cx="62" cy="22" r="2.4" fill="#0e1012" stroke="#e8c56a" stroke-width="1.6"/>
  <!-- KIX arrow tip -->
  <path d="M104 18 L112 24 L104 30" fill="none" stroke="#e8c56a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- small tick marks along path (geometric, not map) -->
  <path d="M34 22 v6 M86 14 v6" stroke="#e8c56a" stroke-opacity=".45" stroke-width="1.2" stroke-linecap="round"/>
</svg>
