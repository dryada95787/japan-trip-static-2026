<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-hidden="true">
  <title>Osaka night lines</title>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e8c56a" stop-opacity=".4"/>
      <stop offset="70%" stop-color="#e8c56a" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#0e1012" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" fill="url(#glow)"/>
  <!-- slanted night signage lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 80 H280" stroke="url(#neon)" stroke-width="3"/>
    <path d="M60 110 H220" stroke="#e8c56a" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M320 60 H520" stroke="url(#neon)" stroke-width="2.5"/>
    <path d="M340 90 H480" stroke="#e8c56a" stroke-opacity=".14" stroke-width="1.2"/>
    <path d="M480 140 H680" stroke="url(#neon)" stroke-width="3.5"/>
    <path d="M500 170 H640" stroke="#e8c56a" stroke-opacity=".2" stroke-width="1.5"/>
    <path d="M80 200 H200" stroke="#e8c56a" stroke-opacity=".22" stroke-width="2"/>
    <path d="M240 220 H400" stroke="url(#neon)" stroke-width="2"/>
  </g>
  <!-- vertical neon ribs -->
  <g stroke="#e8c56a" stroke-opacity=".12" stroke-width="1">
    <path d="M120 40 V320 M200 50 V300 M360 30 V310 M560 45 V330 M640 55 V290"/>
  </g>
  <!-- ground reflection -->
  <ellipse cx="360" cy="340" rx="280" ry="18" fill="#e8c56a" fill-opacity=".06"/>
  <path d="M40 320 H680" stroke="#e8c56a" stroke-opacity=".1" stroke-width="1"/>
  <!-- abstract storefront blocks -->
  <g fill="#e8c56a" fill-opacity=".05" stroke="#e8c56a" stroke-opacity=".1" stroke-width="1">
    <rect x="90" y="230" width="50" height="90"/>
    <rect x="160" y="250" width="36" height="70"/>
    <rect x="340" y="220" width="60" height="100"/>
    <rect x="520" y="240" width="44" height="80"/>
  </g>
</svg>
