<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-hidden="true">
  <title>Shinkansen corridor</title>
  <defs>
    <linearGradient id="persp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity="0"/>
      <stop offset="45%" stop-color="#e8c56a" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c56a" stop-opacity=".05"/>
      <stop offset="50%" stop-color="#e8c56a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#e8c56a" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <!-- vanishing corridor -->
  <path d="M40 280 L480 80 L920 280" fill="none" stroke="url(#persp)" stroke-width="1.2"/>
  <path d="M80 280 L480 100 L880 280" fill="none" stroke="#e8c56a" stroke-opacity=".1" stroke-width="1"/>
  <path d="M140 280 L480 120 L820 280" fill="none" stroke="#e8c56a" stroke-opacity=".07" stroke-width="1"/>
  <!-- rails -->
  <path d="M60 250 H900" stroke="url(#rail)" stroke-width="1.5" fill="none"/>
  <path d="M100 265 H860" stroke="url(#rail)" stroke-width="1" fill="none"/>
  <!-- sleeper ticks -->
  <g stroke="#e8c56a" stroke-opacity=".18" stroke-width="1.2" stroke-linecap="round">
    <path d="M200 242 v16 M280 242 v16 M360 242 v16 M440 242 v16 M520 242 v16 M600 242 v16 M680 242 v16 M760 242 v16"/>
  </g>
  <!-- abstract nose wedge -->
  <path d="M420 200 L480 168 L540 200 L520 210 L440 210 Z" fill="#e8c56a" fill-opacity=".08" stroke="#e8c56a" stroke-opacity=".28" stroke-width="1"/>
  <ellipse cx="480" cy="188" rx="8" ry="4" fill="#e8c56a" fill-opacity=".35"/>
  <!-- overhead catenary suggestion -->
  <path d="M160 140 Q480 60 800 140" fill="none" stroke="#e8c56a" stroke-opacity=".1" stroke-width="1"/>
  <path d="M480 80 V168" stroke="#e8c56a" stroke-opacity=".12" stroke-width="1"/>
</svg>
